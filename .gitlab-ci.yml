image: maven:3-openjdk-17

variables:
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --no-transfer-progress
    -DinstallAtEnd=true
    -DdeployAtEnd=true
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

cache:
  paths:
    - .m2/repository

stages:
  - test

.verify:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify

verify:
  extends:
    - .verify
