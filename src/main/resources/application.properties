spring.application.name=booking-service
spring.main.banner-mode=off
spring.output.ansi.enabled=never

logging.level.root=WARN
logging.level.com.example.booking=WARN
logging.level.com.example.booking.concurrency=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/booking-service.log
